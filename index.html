rds">Review key chunks →</button><button class="btn ghost" data-action="returnwrite">Edit my writing</button></div></section><div id="notice" class="inline-notice" role="status">${escapeHTML(state.notice)}</div>`}
function renderDrill(){const i=state.drill,s=STAGES[i],correct=state.drillPass.includes(i);return `<div class="sheet"><div class="eyebrow">Reading8-inspired reconstruction</div><h1 style="font-size:clamp(34px,5.5vw,55px)">THE CHUNK LAB.</h1><p class="lede">Work with the five model sentences. Rebuild one original sentence from meaning-based chunks, or write it from memory. Answers remain hidden until you check or reveal them.</p><div class="divider"></div><div class="subhead">Choose a sentence <span class="pill" style="float:right">${state.drillPass.length}/5 reconstructed</span></div><div class="selector">${STAGES.map((v,j)=>`<button type="button" data-drill="${j}" class="choice ${j===i?'selected':''} ${state.drillPass.includes(j)?'solved':''}">${j+1} · ${v.name}</button>`).join('')}</div><div class="modebar"><button class="btn small ${state.drillMode==='chunks'?'selected':''}" data-action="modechunks">01 · Arrange chunks</button><button class="btn small ${state.drillMode==='recall'?'selected':''}" data-action="moderecall">02 · Write from memory</button></div>
<div class="drill-layout"><div class="callout"><div class="subhead">Think first · ${s.name}</div><p class="why">${s.prompt}</p><p class="why" style="margin-bottom:0">${s.think}</p>${state.drillHint?`<div class="hintbox">${s.hint}<div style="margin-top:8px"><strong>First chunk:</strong> ${escapeHTML(CHUNKS[i][0])}</div></div>`:''}<div class="button-row" style="margin-top:16px"><button class="btn small" data-action="drillhint">${state.drillHint?'Hide hint':'Hint'}</button><button class="btn small ghost" data-action="drillanswer">${state.drillAnswer?'Hide answer':'Show answer'}</button></div>${state.drillAnswer?`<div class="feedback"><strong>Original model:</strong> ${escapeHTML(s.model)}</div>`:''}</div><div><div class="subhead">${state.drillMode==='chunks'?'Build the sentence':'Write the sentence from memory'}</div>${state.drillMode==='chunks'?`<div class="dropzone" aria-label="Selected chunks">${state.drillSelected.length?state.drillSelected.map((id,pos)=>`<button type="button" class="chunk placed" data-unchunk="${pos}" title="Tap to remove this chunk">${escapeHTML(CHUNKS[i][id])} ×</button>`).join(''):'<span class="disabled-msg">Tap the chunks to build the original sentence.</span>'}</div><div class="bank">${state.chunkBanks[i].filter(o=>!state.drillSelected.includes(o.id)).map(o=>`<button type="button" class="chunk" data-chunk="${o.id}">${escapeHTML(o.text)}</button>`).join('')}</div>`:`<label for="recall" class="visually-hidden">Write from memory</label><textarea id="recall" class="text-entry" style="min-height:145px" placeholder="Write one model sentence from memory...">${escapeHTML(state.drillTyped)}</textarea><p class="tiny muted">Check compares your writing with the exact model sentence. Other grammatical sentences may still be correct.</p>`}<div class="button-row"><button class="btn primary" data-action="drillcheck">Check</button><button class="btn ghost" data-action="drillclear">Clear</button><button class="btn ghost" data-action="drillnext">Next →</button></div>${state.drillNotice?`<div class="feedback ${state.drillNotice.startsWith('Not')?'bad':''}" role="status">${escapeHTML(state.drillNotice)}</div>`:''}</div></div></div>`}
function visibleCards(){return state.cardOrder.filter(i=>!state.cardsFilter||state.review.has(i))}
function renderCards(){const visible=visibleCards();if(!visible.includes(state.card))state.card=visible[0]??0;const w=WORDS[state.card];const index=visible.indexOf(state.card);return `<div class="sheet" style="margin-bottom:20px"><div class="eyebrow">Reading8 • Review cards</div><h1 style="font-size:clamp(35px,5.3vw,55px)">NOTICE. LEARN. REUSE.</h1><p class="lede">Study useful chunks from the model paragraph. Tap the card to reveal a simple English meaning, US IPA, a reusable pattern, and the original model sentence. Vietnamese stays hidden until requested.</p><div class="button-row"><button class="btn small ${state.cardsFilter?'':'primary'}" data-action="filterall">All cards (${WORDS.length})</button><button class="btn small ${state.cardsFilter?'primary':''}" data-action="filterreview">Need review (${state.review.size})</button><button class="btn small ghost" data-action="shufflecards">Shuffle</button><button class="btn small ghost" data-action="resetcards">Reset cards</button></div></div>
${!visible.length?`<section class="sheet"><h3>No cards marked for review yet.</h3><button class="btn primary" data-action="filterall">Show all cards</button></section>`:`<div class="card-layout"><aside class="sheet"><div class="subhead">Chunk index · ${index+1}/${visible.length} · swipe →</div><div class="word-list">${visible.map(id=>`<button class="word-item ${id===state.card?'selected':''}" data-selectcard="${id}">${escapeHTML(WORDS[id].p)} <small>${escapeHTML(WORDS[id].type)} · Step ${WORDS[id].step+1}</small></button>`).join('')}</div></aside><div><div class="flashcard ${state.cardFlip?'back':'front'}" tabindex="0" role="button" aria-label="${state.cardFlip?'Hide':'Reveal'} review card details" id="flashcard"><div><div class="eyebrow">${state.cardFlip?'Card back · meaning':'Card front · English only'}</div><div class="subhead" style="margin-top:16px">${escapeHTML(w.type)}</div><div class="phrase">${escapeHTML(w.p)}</div></div>${state.cardFlip?`<div style="margin-top:22px"><div class="ipa">${escapeHTML(w.ipa)}</div><div class="divider"></div><div class="definition"><strong>Simple English:</strong> ${escapeHTML(w.en)}</div>${state.cardVi?`<div class="translation" style="margin-top:8px"><strong>Tiếng Việt:</strong> ${escapeHTML(w.vi)}</div>`:''}<div class="pattern"><strong>Pattern:</strong> ${escapeHTML(w.pat)}</div><div class="pattern"><strong>Original sentence:</strong> ${escapeHTML(STAGES[w.step].model)}${state.cardVi?`<div style="color:#7d5040;margin-top:5px">${escapeHTML(VI_MODELS[w.step])}</div>`:''}</div></div>`:`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><strong class="small-label">Think of the meaning first</strong><span class="pill">Tap to reveal</span></div>`}</div><div class="button-row" style="margin-top:22px"><button class="btn" data-action="cardprev">← Previous</button><button class="btn primary" data-action="cardflip">${state.cardFlip?'Hide answer':'Show answer'}</button><button class="btn" data-action="cardnext">Next →</button></div><div class="button-row" style="margin-top:13px"><button class="btn small ${state.review.has(state.card)?'orange':'ghost'}" data-action="markreview">${state.review.has(state.card)?'✓ Need review':'Mark: need review'}</button><button class="btn small ghost" data-action="markremember">✓ I remember this</button><button class="btn small ghost" data-action="cardvi">${state.cardVi?'Hide Vietnamese':'Show Vietnamese'}</button><button class="btn small ghost" data-action="cardsent">Open source sentence →</button></div><p class="tiny muted" style="margin-top:15px">Vietnamese remains hidden until you select Show Vietnamese. Tap highlighted chunks in a model sentence to open their cards.</p></div></div>`}`}
function render(){badgeNav();app.innerHTML=state.view==='home'?renderHome():state.view==='write'?renderWrite():state.view==='drill'?renderDrill():state.view==='cards'?renderCards():renderSummary();}
function setStep(n){if(n<0||n>4)return;state.step=n;state.hint=false;render();}
function saveEntry(){const elem=$('entry');if(elem){state.entries[state.step].draft=elem.value}}
function appendChip(index){const box=$('entry');if(!box)return;const word=STAGES[state.step].words[index];const start=box.selectionStart,end=box.selectionEnd;const before=box.value.slice(0,start),after=box.value.slice(end);const prefix=before.trim()&& !/\s$/.test(before)?' ':'';const suffix=after&& !/^\s/.test(after)?' ':'';box.value=before+prefix+word+suffix+after;const pos=(before+prefix+word).length;box.focus();box.setSelectionRange(pos,pos);saveEntry();updateWordcount()}
function updateWordcount(){const wc=$('wordcount');if(wc&&$('entry'))wc.textContent=`${countWords($('entry').value)} words`}
function evaluateAndRender(){saveEntry();const e=state.entries[state.step];if(!e.draft.trim()){const field=$('entry');field.focus();field.setAttribute('aria-invalid','true');field.placeholder='Please write a sentence first.';return;}e.draft=e.draft.trim();e.checked=true;render();requestAnimationFrame(()=>{$('feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'})})}
function finishSentence(useModel){saveEntry();const e=state.entries[state.step];if(!e.checked)return;e.saved=useModel?STAGES[state.step].model:e.draft.trim();e.useModel=useModel;e.review=true;if(state.step===4){state.view='summary';state.notice='Your paragraph is ready.';render();window.scrollTo({top:0,behavior:'smooth'})}else{state.step++;state.hint=false;render();window.scrollTo({top:0,behavior:'smooth'})}}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){try{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.top='-2000px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}}
function downloadText(filename,text){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),2500)}
function switchDrill(i){state.drill=i;state.drillSelected=[];state.drillTyped='';state.drillHint=false;state.drillAnswer=false;state.drillNotice='';render()}
function nextCard(delta){const v=visibleCards();if(!v.length)return;const p=v.indexOf(state.card);state.card=v[(p+delta+v.length)%v.length];state.cardFlip=false;state.cardVi=false;render()}
function notify(message){state.notice=message;const area=$('notice');if(area)area.textContent=message}
async function handleAction(act){switch(act){
case 'start':goto('write');break;
case 'modeltoggle':state.modelOpen=!state.modelOpen;render();break;
case 'summary':state.view='summary';render();window.scrollTo({top:0,behavior:'smooth'});break;
case 'returnwrite':goto('write');break;
case 'vitoggle':state.vi=!state.vi;render();break;
case 'check':evaluateAndRender();break;
case 'hint':saveEntry();state.hint=!state.hint;render();break;
case 'stagevi':saveEntry();state.stageVi=!state.stageVi;render();break;
case 'clearentry':state.entries[state.step].draft='';state.entries[state.step].checked=false;state.hint=false;render();break;
case 'prevstage':saveEntry();setStep(state.step-1);break;
case 'nextstage':saveEntry();setStep(state.step+1);break;
case 'keepsentence':finishSentence(false);break;
case 'usesample':finishSentence(true);break;
case 'edit':state.entries[state.step].checked=false;render();$('entry')?.focus();break;
case 'copymine':notify(await copyText(state.entries.map(e=>e.saved||'[unfinished]').join(' '))?'Copied your paragraph.':'Copy unavailable. Please select and copy the text.');break;
case 'copymodel':notify(await copyText(STAGES.map(x=>x.model).join(' '))?'Copied the model paragraph.':'Copy unavailable. Please select and copy the text.');if(state.view==='home')alert(state.notice);break;
case 'txt':downloadText('my-picture-paragraph.txt',state.entries.map(e=>e.saved||'[unfinished]').join(' '));notify('Text file created.');break;
case 'modechunks':state.drillMode='chunks';state.drillNotice='';render();break;
case 'moderecall':state.drillMode='recall';state.drillNotice='';render();break;
case 'drillhint':state.drillHint=!state.drillHint;render();break;
case 'drillanswer':state.drillAnswer=!state.drillAnswer;render();break;
case 'drillclear':state.drillSelected=[];state.drillTyped='';state.drillNotice='';state.chunkBanks[state.drill]=shuffled(CHUNKS[state.drill].map((text,id)=>({text,id})));render();break;
case 'drillnext':switchDrill((state.drill+1)%5);break;
case 'drillcheck':{const i=state.drill;const candidate=state.drillMode==='chunks'?state.drillSelected.map(id=>CHUNKS[i][id]).join(' '):state.drillTyped.trim();if(!candidate){state.drillNotice='Add some chunks or write a sentence before checking.';render();break}const ok=candidate===STAGES[i].model;if(ok){if(!state.drillPass.includes(i))state.drillPass.push(i);state.drillNotice='Excellent. Your sentence matches the original model exactly.';}else state.drillNotice='Not the exact model yet. Check the order, wording, capital letter, and final punctuation. Other versions may still be grammatical.';render();break}
case 'cardprev':nextCard(-1);break;
case 'cardnext':nextCard(1);break;
case 'cardflip':state.cardFlip=!state.cardFlip;render();break;
case 'cardvi':state.cardVi=!state.cardVi;render();break;
case 'markreview':if(state.review.has(state.card))state.review.delete(state.card);else state.review.add(state.card);render();break;
case 'markremember':state.review.delete(state.card);if(state.cardsFilter&&visibleCards().length===0)state.cardsFilter=false;nextCard(1);break;
case 'shufflecards':state.cardOrder=shuffled(state.cardOrder.map((id,i)=>({id,i}))).map(o=>o.id);state.cardFlip=false;state.cardVi=false;render();break;
case 'resetcards':state.review.clear();state.cardOrder=WORDS.map((_,i)=>i);state.cardsFilter=false;state.card=0;state.cardFlip=false;state.cardVi=false;render();break;
case 'filterall':state.cardsFilter=false;render();break;
case 'filterreview':state.cardsFilter=true;render();break;
case 'cardsent':state.drill=WORDS[state.card].step;state.drillSelected=[];state.drillNotice='';state.drillHint=false;state.drillAnswer=false;goto('drill');break;
}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return}const step=e.target.closest('[data-step]');if(step){saveEntry();setStep(Number(step.dataset.step));return}const chip=e.target.closest('[data-chip]');if(chip){appendChip(Number(chip.dataset.chip));return}const dr=e.target.closest('[data-drill]');if(dr){switchDrill(Number(dr.dataset.drill));return}const ch=e.target.closest('[data-chunk]');if(ch){const id=Number(ch.dataset.chunk);if(!state.drillSelected.includes(id))state.drillSelected.push(id);state.drillNotice='';render();return}const un=e.target.closest('[data-unchunk]');if(un){state.drillSelected.splice(Number(un.dataset.unchunk),1);state.drillNotice='';render();return}const cs=e.target.closest('[data-selectcard]');if(cs){state.card=Number(cs.dataset.selectcard);state.cardFlip=false;state.cardVi=false;render();return}const jump=e.target.closest('[data-cardjump]');if(jump){state.card=Number(jump.dataset.cardjump);state.cardFlip=false;state.cardVi=false;goto('cards');return}if(e.target.closest('#flashcard')){state.cardFlip=!state.cardFlip;render();return}const a=e.target.closest('[data-action]');if(a)handleAction(a.dataset.action)});
document.addEventListener('input',e=>{if(e.target.id==='entry'){saveEntry();updateWordcount()}if(e.target.id==='recall')state.drillTyped=e.target.value});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='flashcard'){e.preventDefault();state.cardFlip=!state.cardFlip;render()}});
render();
</script>
</body></html>
